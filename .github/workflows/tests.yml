name: Recovery tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components

  ha-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.13'
            ha: '2025.2.2'
          - python: '3.14'
            ha: '2026.10.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install homeassistant==${{ matrix.ha }} serialx==1.11.0
      - run: python scripts/ha_smoke.py
      - run: python scripts/serial_smoke.py
